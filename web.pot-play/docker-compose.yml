services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pot-play-landing
    ports:
      - "3030:3000"
    environment:
      - NODE_ENV=production
      # nginx가 /api/inquiry/landing 을 백엔드로 전달 (blue/green 전환 시 env로 변경)
      - INQUIRY_UPSTREAM_URL=${INQUIRY_UPSTREAM_URL:-http://pot-play-backend-green:3000/api/v1/inquiry/landing}
    restart: unless-stopped
    # 백엔드와 통신을 위해 동일한 네트워크 사용
    networks:
      - admin-network

networks:
  admin-network:
    external: true
    name: pot-play-backend_default # 운영 서버용
    # name: pot-play-backend-develop_default  # 개발 서버용
